<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="scarwatch">
  <circle cx="128" cy="128" r="120" fill="#0b2540"/>
  <circle cx="128" cy="128" r="120" stroke="#cfd6da" stroke-width="1.5" opacity="0.35"/>
  <!-- waterline -->
  <line x1="44" y1="196" x2="212" y2="196" stroke="#cfd6da" stroke-width="2" opacity="0.55"/>
